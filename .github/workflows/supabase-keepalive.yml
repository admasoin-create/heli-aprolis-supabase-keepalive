
name: Supabase HELI - Maintien actif

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la base HELI
        env:
          SUPABASE_URL: https://qxjhecxozdtyhejnrpyb.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/heli_stores?select=*&limit=1"

